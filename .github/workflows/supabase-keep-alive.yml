name: Keep Supabase Alive

on:
  schedule:
    # Runs every 5 days at 08:00 UTC (well within the 7-day pause window)
    - cron: '0 8 */5 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Response status: $response"

          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "Ping successful - project is active"
          elif [ "$response" -eq 404 ]; then
            echo "Table not found (404) - project is alive but table may not exist"
            echo "Create a 'keep_alive' table in Supabase, or update the table name above"
            exit 1
          else
            echo "Unexpected response: $response"
            exit 1
          fi
