name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjZmV0Zm5pb2x4emFjc2R4bXluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NTA4NzMsImV4cCI6MjA5MDAyNjg3M30.5TsI3YTfgXmUwkSD0wZEZz_SkffMtAa9zoR208ZsEfs }}")

          echo "Response status: $response"

          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "Ping successful - project is active"
          else
            echo "Unexpected response: $response"
            exit 1
          fi
